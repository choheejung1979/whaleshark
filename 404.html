<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>404 | Boracay Whale Shark</title>
<style>
  body {
    background: #020617;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .nf-container {
    background: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 60px 40px;
    border-radius: 30px;
    text-align: center;
    max-width: 500px;
    width: 90%;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
  }
  .nf-code {
    font-size: 4rem;
    font-weight: 900;
    color: #3b82f6;
    margin: 0 0 10px 0;
    letter-spacing: -2px;
  }
  .nf-title {
    font-size: 1.5rem;
    font-weight: 800;
    margin-bottom: 15px;
    color: #fff;
  }
  .nf-desc {
    color: rgba(255, 255, 255, 0.7);
    font-size: 1rem;
    line-height: 1.7;
    margin-bottom: 40px;
    word-break: keep-all;
  }
  .nf-desc .en { display: block; margin-top: 6px; color: rgba(255, 255, 255, 0.5); font-size: 0.9rem; }
  .home-btn {
    display: inline-block;
    background: #3b82f6;
    color: #fff;
    padding: 16px 40px;
    border-radius: 99px;
    text-decoration: none;
    font-weight: 700;
    font-size: 1.1rem;
    box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4);
    transition: all 0.3s ease;
  }
  .home-btn:hover {
    background: #2563eb;
    box-shadow: 0 15px 25px rgba(59, 130, 246, 0.6);
    transform: translateY(-2px);
  }
</style>
</head>
<body>

<div class="nf-container">
  <p class="nf-code">404</p>
  <h1 class="nf-title">페이지를 찾을 수 없습니다</h1>
  <p class="nf-desc">
    요청하신 페이지가 존재하지 않거나 이동되었습니다.
    <span class="en">The page you requested does not exist or has been moved.</span>
  </p>
  <a href="/" class="home-btn">홈으로 돌아가기 · Return Home</a>
</div>

</body>
</html>
