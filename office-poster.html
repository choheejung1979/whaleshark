<title>Whale Shark Fast Track &mdash; Office Poster (A4)</title>
<meta name="robots" content="noindex, nofollow">

<style>
@page { size: A4 portrait; margin: 0; }

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  word-break: keep-all;   /* 한글 단어가 중간에서 갈라지지 않게 */
  background: #52555a;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.page {
  width: 210mm;
  height: 297mm;
  margin: 10mm auto;
  overflow: hidden;
  box-shadow: 0 6px 30px rgba(0,0,0,.35);
  /* 배너 위·아래 가장자리에서 뽑은 색이라 이미지와 여백의 경계가 드러나지 않는다 */
  background: linear-gradient(180deg, #023076 0%, #02337a 50%, #023472 100%);
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
  color: #fff;
  display: flex;
  align-items: stretch;
}

.banner { width: 160mm; flex-shrink: 0; }
.banner img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }

/* ── 우측 기둥 ── */
.side {
  flex: 1;
  text-align: center;
  padding: 0 4mm;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.side .kicker {
  font-size: 3mm;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #F5B335;
  margin-bottom: 3mm;
  line-height: 1.5;
}
.qr-box {
  width: 42mm; height: 42mm;
  margin: 0 auto;
  background: #fff;
  border-radius: 2.5mm;
  padding: 2.5mm;
}
.qr-box svg { width: 100%; height: 100%; display: block; }
.side .scan {
  margin-top: 3.5mm;
  font-size: 5mm;
  font-weight: 900;
  line-height: 1.15;
}
.side .url {
  margin-top: 1.5mm;
  font-size: 2.8mm;
  font-weight: 800;
  color: #F5B335;
  word-break: break-all;
}
.side .note {
  margin-top: 3mm;
  padding-top: 3mm;
  border-top: .4mm solid rgba(255,255,255,.28);
  font-size: 2.7mm;
  font-weight: 600;
  color: #bcd9ef;
  line-height: 1.5;
}
.side .brand {
  margin-top: 4mm;
  font-size: 2.5mm;
  font-weight: 900;
  letter-spacing: .5px;
  line-height: 1.5;
}
.side .brand span { display: block; font-weight: 600; color: #8fbcdd; letter-spacing: 0; }

@media print {
  html, body { background: #fff; }
  .page { margin: 0; box-shadow: none; }
}
</style>
